[project]
name = "live2d-studio-see-through-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Headless inference subset of upstream df019de5. No Qt, training, detectron2,
# mmcv, SAM2 or hosted inference. Source is loaded from a pinned local checkout.
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "numpy==2.2.6", "pillow==12.1.1", "opencv-python==4.13.0.92",
  "scipy==1.15.3", "matplotlib==3.9.4", "einops==0.8.2",
  "transformers==5.0.0", "diffusers==0.37.0", "huggingface-hub==1.7.2",
  "tokenizers==0.22.2", "accelerate==1.13.0", "safetensors==0.7.0",
  "pyyaml==6.0.3", "pycocotools==2.0.11", "psd-tools[composite]==1.14.2",
  "tqdm==4.67.3", "requests==2.32.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
