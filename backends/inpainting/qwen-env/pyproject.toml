[project]
name = "live2d-studio-qwen-experiment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "torch==2.8.0", "torchvision==0.23.0", "numpy==2.2.6", "pillow==12.1.1",
 "safetensors==0.7.0", "packaging==26.3", "transformers==4.57.1",
 "torchsde==0.2.6", "einops==0.8.2", "sentencepiece==0.2.1", "scipy==1.15.3",
 "pyyaml==6.0.3", "tqdm==4.67.3", "psutil==7.1.0", "aiohttp==3.13.3",
 "pydantic==2.12.5", "pydantic-settings==2.12.0", "av==16.0.1", "gguf==0.17.1"
]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
